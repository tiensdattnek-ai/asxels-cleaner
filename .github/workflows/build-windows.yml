name: Build Python Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test-and-build:
    name: Python / Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install -r requirements.txt

      - name: Run safety tests
        run: python -m unittest discover -s tests -v

      - name: Build one-file Windows application
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name AsxelsCleaner --version-file version_info.txt --collect-all tkinter main.py

      - name: Validate executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AsxelsCleaner.exe')) { throw 'AsxelsCleaner.exe was not created.' }
          Write-Host "OK  dist/AsxelsCleaner.exe  $((Get-Item 'dist/AsxelsCleaner.exe').Length) bytes"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AsxelsCleaner-Windows-x64
          path: dist/AsxelsCleaner.exe
          if-no-files-found: error
