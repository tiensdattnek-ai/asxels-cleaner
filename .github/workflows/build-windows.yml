name: Build native Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: C++20 / Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Install runtime pair
        run: cmake --install build --config Release --prefix dist

      - name: Validate distributable files
        shell: pwsh
        run: |
          $required = 'dist/AsxelsCleaner.exe', 'dist/AsxelsEngine.dll'
          $required | ForEach-Object {
            if (!(Test-Path $_)) { throw "Missing required runtime file: $_" }
            Write-Host "OK  $_  $((Get-Item $_).Length) bytes"
          }
          Compress-Archive -Path $required -DestinationPath 'dist/AsxelsCleaner-Windows-x64.zip' -Force

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: AsxelsCleaner-Windows-x64
          path: dist/
          if-no-files-found: error
